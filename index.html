<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ligamester</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: toppfelt med klubb og neste kamp, fanerad, innhold i kort og tabeller. Bane-grafikk for oppstilling. */
:root{
  --bg:#EBF0EC; --surface:#F7FAF7; --surface2:#E2EAE4; --ink:#14241C; --muted:#586A60; --line:#C7D3CB;
  --pitch:#2F7F57; --pitch2:#2B7552; --pitch-line:rgba(255,255,255,.55);
  --accent:#E6B31A; --accent-ink:#2A2000; --good:#1D7F49; --bad:#BE3B28; --warn:#9A6A12; --link:#1B6B46;
  --h0-bg:#E5ECE7; --h0-fg:#586A60; --h1-bg:#CFE4D7; --h1-fg:#14241C; --h2-bg:#A3D2B5; --h2-fg:#0E2A1C;
  --h3-bg:#5DB083; --h3-fg:#07221A; --h4-bg:#1B6F45; --h4-fg:#FFFFFF;
  --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --shadow:0 1px 0 rgba(20,36,28,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1914; --surface:#15241D; --surface2:#1C2E25; --ink:#E5EEE8; --muted:#8CA195; --line:#26392F;
    --pitch:#1D5A3E; --pitch2:#1A5238; --pitch-line:rgba(255,255,255,.38);
    --accent:#F0C23A; --accent-ink:#241A00; --good:#4CC17E; --bad:#F0735E; --warn:#E3B04B; --link:#7DD3A5;
    --h0-bg:#1B2B23; --h0-fg:#8CA195; --h1-bg:#20382C; --h1-fg:#D2E6DA; --h2-bg:#285640; --h2-fg:#E5F3EA;
    --h3-bg:#34805C; --h3-fg:#FFFFFF; --h4-bg:#52BC87; --h4-fg:#04170E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1914; --surface:#15241D; --surface2:#1C2E25; --ink:#E5EEE8; --muted:#8CA195; --line:#26392F;
  --pitch:#1D5A3E; --pitch2:#1A5238; --pitch-line:rgba(255,255,255,.38);
  --accent:#F0C23A; --accent-ink:#241A00; --good:#4CC17E; --bad:#F0735E; --warn:#E3B04B; --link:#7DD3A5;
  --h0-bg:#1B2B23; --h0-fg:#8CA195; --h1-bg:#20382C; --h1-fg:#D2E6DA; --h2-bg:#285640; --h2-fg:#E5F3EA;
  --h3-bg:#34805C; --h3-fg:#FFFFFF; --h4-bg:#52BC87; --h4-fg:#04170E;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;letter-spacing:.02em;margin:0;text-wrap:balance}
button,select,input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.caps{text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:600;color:var(--muted)}
a{color:var(--link)}

/* topp */
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:16px 0 12px}
.brand{display:flex;align-items:baseline;gap:12px}
.brand b{font:700 28px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.brand span{font-size:13px;color:var(--muted)}
.topinfo{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.club{display:flex;align-items:center;gap:10px;min-width:0}
.club b{font:600 20px/1.1 var(--f-display);letter-spacing:.02em}
.stat{display:flex;flex-direction:column;line-height:1.15}
.stat .v{font:600 18px/1.1 var(--f-display);letter-spacing:.02em}
.crest{display:block;flex:none}

/* faner */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:20px;scrollbar-width:thin}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px 8px;margin-bottom:-1px;
  font:600 17px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* kort og rutenett */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:20px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 small{font:500 13px var(--f-body);color:var(--muted);letter-spacing:0}
.sectionhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px;flex-wrap:wrap}
.sectionhead h2{font-size:26px;text-transform:uppercase}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font:600 12px/1.2 var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--surface2);position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
tbody tr.me td{background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface2)}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}

/* knapper */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:3px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.sm{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;flex-wrap:wrap}
.seg button{appearance:none;border:0;border-right:1px solid var(--line);background:var(--surface);padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
select,input[type=number],input[type=text]{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:6px 8px;max-width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
label.f select,label.f input{font-size:15px;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:500}

/* egenskaper */
.sk{display:inline-block;min-width:2.3em;padding:2px 0;text-align:center;border-radius:2px;font:600 14px/1.2 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.sk.h0{background:var(--h0-bg);color:var(--h0-fg)} .sk.h1{background:var(--h1-bg);color:var(--h1-fg)} .sk.h2{background:var(--h2-bg);color:var(--h2-fg)}
.sk.h3{background:var(--h3-bg);color:var(--h3-fg)} .sk.h4{background:var(--h4-bg);color:var(--h4-fg)}
.spec{display:inline-block;font:600 11px/1 var(--f-display);letter-spacing:.07em;text-transform:uppercase;padding:3px 5px 2px;border-radius:2px;border:1px solid var(--line);color:var(--muted);vertical-align:2px}
.tag{display:inline-block;font:600 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:2px;background:var(--surface2);color:var(--muted)}
.tag.ai{background:transparent;border:1px solid var(--line)}
.tag.human{background:var(--accent);color:var(--accent-ink)}
.tag.sale{background:color-mix(in srgb,var(--warn) 22%,var(--surface));color:var(--warn)}
.pname{font-weight:600}
.up{color:var(--good)} .down{color:var(--bad)}
.bar{height:8px;background:var(--surface2);border-radius:1px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--pitch)}
.bar.acc i{background:var(--accent)}

/* sektorratinger */
.ratings{display:grid;gap:6px}
.rrow{display:grid;grid-template-columns:minmax(98px,128px) 1fr 38px;gap:10px;align-items:center;font-size:14px}
.rrow .lab{color:var(--muted)}
.rrow .val{font:600 17px var(--f-display);text-align:right;font-variant-numeric:tabular-nums}
.rbar{position:relative;height:10px;background:var(--surface2);border-radius:1px}
.rbar i{position:absolute;left:0;top:0;bottom:0;background:var(--pitch);border-radius:1px}
.rbar i.opp{top:auto;height:4px;background:var(--accent);bottom:0;border-radius:0}
.rbar.duo{height:14px}
.rbar.duo i:first-child{bottom:6px}

/* bane */
.lineup{display:grid;grid-template-columns:minmax(0,500px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.lineup{grid-template-columns:minmax(0,1fr)}}
.pitchbox{display:flex;flex-direction:column;gap:12px}
.pitch{position:relative;width:100%;max-width:520px;aspect-ratio:100/128;border:2px solid var(--pitch-line);border-radius:3px;
  background:repeating-linear-gradient(to bottom,var(--pitch) 0 8.33%,var(--pitch2) 8.33% 16.66%);overflow:hidden;touch-action:manipulation}
.pitch svg{position:absolute;inset:0;width:100%;height:100%}
.pitch svg *{fill:none;stroke:var(--pitch-line);stroke-width:1.5;vector-effect:non-scaling-stroke}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:0;cursor:pointer;width:25%;color:#fff}
.slot .dot{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:700 16px var(--f-display);letter-spacing:.03em;border:2px solid rgba(255,255,255,.85);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.slot .nm{font:600 12px/1.15 var(--f-body);background:rgba(8,24,16,.72);padding:1px 5px;border-radius:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .ord{font:600 10px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.slot[aria-pressed="true"] .dot{outline:3px solid var(--accent);outline-offset:2px}
.slot.empty .dot{background:rgba(0,0,0,.25)!important;border-style:dashed}
@media (max-width:460px){.slot .dot{width:36px;height:36px;font-size:14px}.slot .nm{font-size:11px}}

/* kamp */
.scoreline{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.scoreline .tm{display:flex;align-items:center;gap:10px;min-width:0}
.scoreline .tm.away{justify-content:flex-end;text-align:right;flex-direction:row-reverse}
.scoreline .tm b{font:600 22px/1.1 var(--f-display);overflow-wrap:anywhere}
.score{font:700 44px/1 var(--f-display);letter-spacing:.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
.fx{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;color:inherit}
.fx:last-child{border-bottom:0}
.fx:hover{background:var(--surface2)}
.fx.me{background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.fx .t{display:flex;align-items:center;gap:8px;min-width:0}
.fx .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx .t.a{justify-content:flex-end;flex-direction:row-reverse}
.fx .sc{font:700 20px/1 var(--f-display);min-width:60px;text-align:center;font-variant-numeric:tabular-nums}
.timeline{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.timeline li{display:grid;grid-template-columns:42px 1fr;gap:10px;align-items:baseline}
.timeline .min{font:600 16px var(--f-display);color:var(--muted);text-align:right}
.timeline .ev.a{text-align:left}
.timeline .ev.h{text-align:left}

/* modal og toast */
.ov{position:fixed;inset:0;background:rgba(5,14,10,.55);display:grid;place-items:start center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:4px;width:min(720px,100%);padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.modal h3{font-size:24px}
.modal .x{float:right}
#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:grid;gap:8px;width:min(480px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:3px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast.err{background:var(--bad);color:#fff}
.note{border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));padding:10px 12px;border-radius:0 3px 3px 0}
.teamgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.tcard{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.tcard .meta{display:flex;flex-direction:column;gap:3px;min-width:0}
.tcard b{font:600 19px/1.1 var(--f-display);overflow-wrap:anywhere}
.tcard .act{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.help h3{margin:18px 0 6px;font-size:20px}
.help p,.help li{max-width:68ch}
.help ul{padding-left:20px;margin:6px 0}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.tab,.btn{transition:background .12s,border-color .12s}}
.timeline .ev .crest{display:inline-block;vertical-align:-3px}
.tcard .meta .tag{align-self:flex-start}
.scoreline{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
.scoreline .tm b{font-size:20px;overflow-wrap:break-word;text-wrap:balance}
.fx{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
.fx .t span{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.15}
.modal .x{float:none;display:block;margin:0 0 10px auto}
.feed{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:0}
.feed li{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:baseline}
.feed li:first-child{border-top:0}
.feed .min{font:600 16px var(--f-display);color:var(--muted);text-align:right}
.feed .tx{max-width:70ch}
.feed li.goal{background:color-mix(in srgb,var(--accent) 16%,var(--surface));margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:2px}
.feed li.goal .tx b{color:var(--good);letter-spacing:.04em}
.feed li.sys .tx{color:var(--muted);font-style:italic}
.fx.sel{box-shadow:inset 3px 0 0 var(--accent)}
.fx .sc small.live{display:block;font:600 11px/1 var(--f-body);letter-spacing:.04em;color:var(--bad);margin-top:3px}
@media (max-width:560px){
.scoreline{gap:8px}
.scoreline .tm{min-width:0;flex:1 1 0;gap:6px}
.scoreline .tm b{font-size:15px;line-height:1.15}
.scoreline .tm svg{flex:none;width:26px;height:auto}
.scoreline .score{font-size:30px}
}
.authform{display:grid;gap:14px;margin-top:12px}
.authform label{display:grid;gap:6px;font-weight:500}
.authform input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink)}
.authform input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.acct{max-width:1180px;margin:24px auto;padding:0 16px;display:flex;gap:10px;align-items:center;justify-content:flex-end;color:var(--muted);font-size:14px}
body.loggedout .acct{display:none}

.kort{display:inline-block;width:10px;height:14px;border-radius:2px;vertical-align:-2px}
.kort.y{background:#E8B312}.kort.r{background:#C8102E}
.ycn{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.ycn .kort{margin-right:3px;width:8px;height:11px;vertical-align:-1px}
.tag.red{background:color-mix(in srgb,var(--bad) 20%,var(--surface));color:var(--bad)}
.tag.cap{background:var(--ink);color:var(--bg)}
.feed li.red .tx{font-weight:600}
.subrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end;padding:12px 0;border-top:1px solid var(--line)}
.subrow:first-of-type{border-top:0}
.subrow select{max-width:100%}

.pip{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-left:4px;vertical-align:2px}
.checks{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px}
.checks li{padding-left:22px;position:relative}
.checks li::before{content:'';position:absolute;left:3px;top:.45em;width:10px;height:10px;border-radius:50%;border:2px solid var(--muted)}
.checks li.ok::before{background:var(--good);border-color:var(--good)}
.seg button[disabled]{opacity:.4;cursor:not-allowed}

/* kamp: ratingsøyler, flaks, kommentarer venstre/høyre */
.dlegend{display:flex;justify-content:space-between;gap:12px;font:600 13px var(--f-body);margin-bottom:4px}
.dlegend .h::before,.dlegend .a::before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;background:var(--pitch)}
.dlegend .a::before{background:var(--accent)}
.dlegend .a{text-align:right}
.dgrp{font:600 12px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 2px;padding-top:8px;border-top:1px solid var(--line)}
.dgrp:first-of-type{border-top:0;margin-top:4px}
.drow{margin:6px 0}
.drow .cap{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.drow .bars{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) 34px;align-items:center}
.dbar{position:relative;height:14px;background:var(--surface2)}
.dbar.h{margin-right:1px}.dbar.a{margin-left:1px}
.dbar i{position:absolute;top:0;bottom:0;opacity:.55}
.dbar.h i{right:0;background:var(--pitch)}
.dbar.a i{left:0;background:var(--accent)}
.dbar.win i{opacity:1}
.dv{font:600 15px var(--f-display);font-variant-numeric:tabular-nums}
.dv.h{text-align:right;padding-right:6px}.dv.a{text-align:left;padding-left:6px}
.scrub{display:flex;align-items:center;gap:10px;margin:0 0 8px;flex-wrap:wrap}
.scrub label{font-size:13px;color:var(--muted)}
.scrub input[type=range]{flex:1;min-width:140px}
.scrub b{min-width:52px}
.luck{margin-top:4px}
.ltrack{position:relative;height:22px;background:var(--surface2);border-radius:2px}
.ltrack .lc{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink);opacity:.5}
.ltrack .lfill{position:absolute;top:6px;bottom:6px;opacity:.7}
.ltrack .lfill.h{background:var(--pitch)}.ltrack .lfill.a{background:var(--accent)}
.lmark{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:20px;line-height:1;color:var(--ink)}
.llab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.feedkey{display:flex;justify-content:space-between;margin-top:4px}
.feed li.h,.feed li.a{margin-top:4px;border-top:0;border-radius:2px;background:color-mix(in srgb,var(--tc,var(--line)) 9%,var(--surface))}
.feed li.h{border-left:4px solid var(--tc);margin-right:14%;padding-left:8px}
.feed li.a{border-right:4px solid var(--tc);margin-left:14%;padding-right:8px;grid-template-columns:1fr 52px;text-align:right}
.feed li.a .min{order:2;text-align:left}
.feed li.a .tx{order:1}

function hashSeed(s){ let h=1779033703^s.length; for(let i=0;i<s.length;i++){ h=Math.imul(h^s.charCodeAt(i),3432918353); h=h<<13|h>>>19; } h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); return (h^h>>>16)>>>0; }

/* ---------- alder i år og dager: ett aldersår = 52 runder (to sesonger) ---------- */
const AGE_ROUNDS = 52;

function rnOf(league){ return (league.s-1)*ROUNDS + league.r; }
function ageAt(p, rn){ return p.bn==null ? p.a : Math.floor((rn-p.bn)/AGE_ROUNDS); }
function ageParts(p, rn){ if(p.bn==null) return {y:p.a, d:null}; const x=rn-p.bn; return {y:Math.floor(x/AGE_ROUNDS), d:Math.floor(((x%AGE_ROUNDS)+AGE_ROUNDS)%AGE_ROUNDS*7/3)}; }
function ensureAges(teams, rn){
  const ch=new Set();
  for(const t of teams) for(const p of t.players){
    if(p.bn==null){ p.bn = rn - p.a*AGE_ROUNDS - (hashSeed(p.id)%AGE_ROUNDS); ch.add(t.i); }
    const a=ageAt(p,rn); if(a!==p.a){ p.a=a; ch.add(t.i); }
  }
  return ch;
}
function genPlayer(r, role, ab, age, names){
  const n = ()=>normal(r)*1.1;
  const sk=[0,0,0,0,0,0,0];
  const set=(i,v)=>{ sk[i]=clamp(Math.round(v+n()),0,20); };
  switch(role){
    case 'GK': set(0,ab+.8); sk[1]=ri(r,1,5); sk[2]=ri(r,0,3); sk[3]=ri(r,0,4); sk[5]=ri(r,0,2); set(6,ab*.5); break;

    case 'WB': set(1,ab); set(4,ab*.6); set(2,ab*.45); set(3,ab*.5); sk[5]=ri(r,0,4); set(6,ab*.35); break;
    case 'IM': set(2,ab+.3); set(3,ab*.85); set(1,ab*.55); sk[4]=ri(r,1,5); set(5,ab*.45); set(6,ab*.5); break;
    case 'W': set(4,ab+.3); set(3,ab*.7); set(2,ab*.55); set(1,ab*.28); set(5,ab*.5); set(6,ab*.4); break;
    default: set(5,ab+.5); set(3,ab*.5); set(2,ab*.4); set(4,ab*.3); sk[1]=ri(r,0,3); set(6,ab*.4);
  }

  if(sw && r()<.28){ const keys=Object.keys(sw); sp=wpick(r,keys,k=>sw[k]); }

  if(names) names.add(name);
  const tm=clamp(Math.round(5+normal(r)*2.2),1,10), ld=clamp(Math.round(4.5+normal(r)*2+(age>=27?0.8:0)),1,10);

  const bn=CUR_RN-age*AGE_ROUNDS-ri(r,0,AGE_ROUNDS-1);
  return {id:uid(r), n:name, a:age, bn, s:sk, pr:[0,0,0,0,0,0,0], f:ri(r,4,6), sp, gl:0, tm, ld, sy, xp, yc:0, sus:0};
}

function ageValueF(a){ return a<=21?1.2: a<=23?1.1: a<=28?1.0: a<=30?.82: a<=32?.6: a<=34?.4: .25; }
function value(p){ const a=Math.max(ability(p),.5); let v=1100*Math.pow(a,2.6)*ageValueF(p.a); if(p.sp) v*=1.08; return Math.max(5000, Math.round(v/1000)*1000); }

function defAllowed(k,d){ if(d<=1) return ['DC']; if(k===0) return ['DC','DL']; if(k===d-1) return ['DC','DR']; return ['DC']; }
function validTy(base, ty){

  for(let i=0;i<11;i++){

  const kpName=Y=>Y.gk?Y.gk.n:'keeperen';

  const rs=[]; const pacc={};
  /* spillerens bidrag til lagets ratinger (ferdighet x koeffisient x form x spesialitet, normalisert som lagratingene) */
  const contribOf=(p,st,o)=>{ const f=formMult(p); let v=0; for(const c of orderedContribs(st,o||'normal')) v+=p.s[c[1]]*c[2]*f*specMult(p,c[3])/NORM[c[0]]; return v; };
  const trackPlayers=(side,w)=>{ side.types.forEach((st,i)=>{ const p=side.by[side.sl[i]]; if(!p) return; const a=pacc[p.id]||(pacc[p.id]={n:p.n,m:0,c:0,st,h:side===sides[0]}); a.m+=w; a.c+=w*contribOf(p,st,side.o[i]); a.st=st; }); };

  function attackOnce(X, Y, side, x, R){
    const secW=[X.rat[4],X.rat[5],X.rat[6]];
    const s=wpick(r,[0,1,2],i=>secW[i]*secW[i]);
    const att=X.rat[4+s], def=Y.rat[mirror[s]];
    const Rr=0.5+(Math.pow(att,1.6)/(Math.pow(att,1.6)+Math.pow(def,1.6))-0.5)*RD_;
    const pShot=Math.min(0.75, 0.5*Math.pow(Rr,1.2));
    if(r()>=pShot) return;
    shots[side==='h'?0:1]++;
    const sh=pickShooter(r,X);
    /* måltsjansen avgjøres av sektorduellen: lagets angrepsrating mot motstanderens forsvarsrating (keeperen er en del av forsvarsratingen) */
    let pg=clamp(PG0+PGK*(Rr-0.5),0.05,0.70);
    if(s!==1){ pg*=0.92; if(sh.p.sp==='hode') pg+=0.06; }
    addx(side,pg);
    const asst = r()<0.72 ? pickAssist(r,X,sh.p) : null;
    const S=sh.p.n, K=kpName(Y);
    const base=buildUp(r,s,S,asst?asst.p.n:null)+' '+shotLine(r,S);
    if(r()<pg) push(x+r()*5,{k:'g', s:side, p:S, i:sh.p.id, a:asst?asst.p.n:null, tx:base+' '+goalLine(r,S,K)});
    else { const o=r(); const kind=o<.55?'sv':o<.77?'ms':o<.9?'bl':'po'; push(x+r()*5,{k:kind, s:side, p:S, tx:base+' '+missLine(r,kind,K,S)}); }
  }
  /* keeper på dødball og straffe: dødball teller mest, keeperskill en del */
  const gkQ=Y=>Y.gk?(0.6*Y.gk.s[6]+0.4*Y.gk.s[0])*fm(Y.gk):0;
  function setPiece(X, Y, side, x, free){
    const sp=X.tk?X.tk.s[6]*fm(X.tk):0;
    const kf=clamp(1.2-0.035*gkQ(Y),0.5,1.3);
    const p=clamp(0.85*kf*(0.025+0.11*(sp/20)+0.014*X.hodeAtk-0.008*Y.hodeDef), 0.01, 0.3);
    shots[side==='h'?0:1]++; addx(side,p);
    const T=X.tk?X.tk.n:'en spiller'; const corner=!free;
    const intro=corner?`Hjørnespark til ${X.team.name}. ${T} slår ballen inn i feltet.`:`Frispark til ${X.team.name} i god posisjon. ${T} står klar over ballen.`;
    if(r()<p){
      const cand=X.xi.filter(z=>z.st!=='GK'); const w=wpick(r,cand,z=>(z.p.sp==='hode'?3:1)*(z.p.s[5]+z.p.s[1]*.5+2));
      const S=w.p.n; const hd=w.p.sp==='hode'||r()<.5;
      const fin = (!corner && w.p===X.tk) ? `${S} sparker ballen rett i mål! ${kpName(Y)} står helt stille.` : hd ? `${S} hever seg høyest og nikker ballen i mål!` : `${S} får ballen og dundrer den i mål!`;
      push(x+r()*5,{k:'s', s:side, p:S, i:w.p.id, a:X.tk?X.tk.n:null, tx:intro+' '+fin+' Så deilig!'});
    } else push(x+r()*5,{k:'sn', s:side, tx:intro+' '+P(r,['Forsvaret klarerer til slutt.',`${kpName(Y)} redder dødballen.`,'Ballen går rett over mål.','Ingenting kommer ut av det.'])});
  }
  function penalty(X, Y, side, x){
    const T=X.tk||bestTakerP(X.xi).p||X.xi[0].p; const tp=T.s[6]*fm(T), ts=T.s[5]*fm(T);
    const tq=0.75*tp+0.25*ts, kq=gkQ(Y); const K=kpName(Y);
    shots[side==='h'?0:1]++;
    const pg=clamp(0.70+0.022*(tq-kq),0.45,0.90); addx(side,pg);
    const intro=`${T.n} stiller opp foran ballen på straffemerket. ${K} står klar på streken.`;
    if(r()<pg) push(x,{k:'p', s:side, p:T.n, i:T.id, a:null, tx:intro+' '+P(r,[`${T.n} skyter sikkert i hjørnet. Mål!`,`${T.n} setter ballen midt i mål, og ${K} kaster seg feil vei!`,`${T.n} sender ballen i krysset! ${K} har ingen sjanse!`])+' Så kald fra elleve meter!'});
    else {
      const saved=r()<clamp(0.5+0.01*(kq-tq),0.35,0.7);
      push(x,{k:saved?'ps':'pm', s:side, p:T.n, tx:intro+' '+(saved?P(r,[`${K} leser ${T.n} og redder straffen!`,`${K} kaster seg riktig og tar straffen!`]):P(r,[`${T.n} setter ballen i stolpen!`,`${T.n} skyter høyt over mål!`,`${T.n} drar den utenfor!`]))});
    }
  }
  function sendOff(side, X, p, x){

    const wasGk=side.types[i]==='GK'; side.sl[i]=null;
    if(wasGk){
      const cand=(side.subsLeft>0 ? Object.values(side.by).filter(q=>!side.played.has(q.id)&&!side.sus.has(q.id)) : onField(side).map(z=>z.p)).sort((a,b)=>b.s[0]-a.s[0]);
      const kp=cand[0];
      if(kp){
        if(side.subsLeft>0 && !side.sl.includes(kp.id)){ side.subsLeft--; side.played.add(kp.id); side.sl[i]=kp.id; side.o[i]='normal'; }
        else { const j=side.sl.indexOf(kp.id); if(j>=0){ side.sl[j]=null; side.sl[i]=kp.id; side.o[i]='normal'; } }
        // laget spiller på ti: ta bort den svakeste utespilleren hvis begge plasser er fylt
        if(side.sl.filter(Boolean).length>10){ let wi=-1,wv=1e9; side.types.forEach((st,j)=>{ if(st==='GK'||!side.sl[j]) return; const v=slotScore(side.by[side.sl[j]],st); if(v<wv){wv=v;wi=j;} }); if(wi>=0) side.sl[wi]=null; }
      }
    }
  }
  function foul(X, Y, sideCode, x, Xs, Ys){
    const w=wpick(r,X.xi,z=>FOUL_W[z.st]*(tmOf(z.p)+2)*(z.p.sy==='kjemp'?1.35:z.p.sy==='fair'?.6:1));
    const victim=P(r,Y.xi.filter(z=>z.st!=='GK').length?Y.xi.filter(z=>z.st!=='GK'):Y.xi).p;
    const p=w.p; const xx=x+r()*5;
    push(xx,{k:'fl', s:sideCode, p:p.n, tx:P(r,[`${p.n} kommer for sent inn mot ${victim.n}. Frispark til ${Y.team.name}.`,`${p.n} tar ${victim.n} hardt. Dommeren blåser for frispark.`,`Det blir frispark etter en dum takling fra ${p.n} på ${victim.n}.`])});
    const tm=tmOf(p); const fair=p.sy==='fair';
    const pRed=0.0004+0.0002*tm; const pY=(0.05+0.03*tm)*(fair?0.7:1)*(Xs.yel[p.id]?0.4:1);
    let red=false, yel=false;
    if(r()<pRed){ red=true; push(xx+0.05,{k:'rc', s:sideCode, p:p.n, i:p.id, tx:`Rødt kort! ${p.n} går i bakken og dommeren viser ham rødt kort for en grov takling. ${X.team.name} må spille med ti mann!`}); cards.push({i:p.id,s:sideCode,k:'r'}); }
    else if(r()<pY){
      if(Xs.yel[p.id]){ red=true; push(xx+0.05,{k:'rc', s:sideCode, p:p.n, i:p.id, tx:`Andre gule kort for ${p.n}, og dermed rødt! ${X.team.name} må spille med ti mann.`}); const ci=cards.findIndex(c=>c.i===p.id&&c.k==='y'); if(ci>=0) cards.splice(ci,1); cards.push({i:p.id,s:sideCode,k:'r'}); }
      else { yel=true; Xs.yel[p.id]=1; push(xx+0.05,{k:'yc', s:sideCode, p:p.n, i:p.id, tx:`Gult kort til ${p.n}.`}); cards.push({i:p.id,s:sideCode,k:'y'}); }
    }
    if(red) sendOff(Xs,X,p,x);
    if(r()<0.04*PEN_W[w.st]){
      push(xx+0.08,{k:'fl', s:sideCode, p:p.n, tx:`${p.n} bryter ned ${victim.n} inne i sekstenmeteren! Dommeren peker på straffemerket!`});

  }
  function wild(X, Y, side, x, frac){
    for(const u of X.unp){
      if(r()>=0.4*frac) continue;
      const ps=u.p.s[3]; const pos=clamp(0.35+0.04*ps,0.35,0.92);
      const oside=side==='h'?'a':'h';
      if(r()<pos){
        const rc=pickShooter(r,X,u.p); if(!rc) continue;
        const K=kpName(Y);
        if(r()<0.8){
          const shv=rc.p.s[5]*fm(rc.p); const kv=(Y.gk?Y.gk.s[0]*fm(Y.gk):2); const q=shv*shv/(shv*shv+kv*kv+0.01);
          const intro=`${u.p.n} ser en glipp i forsvaret og slår en genial gjennombruddspassning! ${rc.p.n} er helt alene med ${K}.`;
          const pu=clamp(0.30+0.45*q,0.3,0.8); addx(side,pu);
          if(r()<pu) push(x+r()*5,{k:'u', s:side, p:rc.p.n, i:rc.p.id, a:u.p.n, tx:intro+' Han holder roen og setter ballen i mål! For en pasning!'});
          else push(x+r()*5,{k:'un', s:side, p:rc.p.n, tx:intro+' '+P(r,[`${K} redder fantastisk!`,`Men ${K} kommer ut og stenger vinkelen.`,`Skuddet går like utenfor!`])});
        } else {
          const intro=`${u.p.n} gjør noe helt uventet! Han dribler to mann og slår en finte.`;
          addx(side,0.6);
          if(r()<0.6) push(x+r()*5,{k:'u', s:side, p:u.p.n, i:u.p.id, a:null, tx:intro+' Så dundrer han ballen i mål!'});
          else push(x+r()*5,{k:'un', s:side, p:u.p.n, tx:intro+' '+P(r,['Men skuddet går like utenfor.',`Men ${K} gjør en flott redning.`])});
        }

        const sh=pickShooter(r,Y); if(!sh) continue;
        addx(oside,0.45);
        if(r()<0.45) push(x+r()*5,{k:'b', s:oside, p:sh.p.n, i:sh.p.id, a:null, tx:`${u.p.n} slurver med ballen rett foran eget mål! ${sh.p.n} er framme og sender den i mål!`});
        else push(x+r()*5,{k:'un', s:side, p:u.p.n, tx:`${u.p.n} mister ballen i en farlig sone, men ${Y.team.name} klarer ikke å utnytte det.`});
      }
    }
  }
  function doSubs(side, x, deficit, sideCode){
    for(const sb of side.subs){
      if(sb.done || side.subsLeft<=0) continue;
      if(gm(x)<sb.m) continue;
      const c=sb.c||'always';
      if(c==='trail' && deficit<=0) continue; if(c==='lead' && deficit>=0) continue; if(c==='draw' && deficit!==0) continue;
      const i=side.sl.indexOf(sb.out); const inn=side.by[sb.inn];
      if(i<0 || !inn || side.played.has(sb.inn) || side.sus.has(sb.inn)){ if(i<0||!inn||side.played.has(sb.inn)||side.sus.has(sb.inn)) sb.done=true; continue; }
      sb.done=true; side.subsLeft--;
      const outP=side.by[sb.out];
      side.sl[i]=sb.inn; side.played.add(sb.inn);
      let moved='';
      if(sb.as && sb.as!==side.types[i] && SUB_SLOTS.includes(sb.as) && side.types[i]!=='GK'){ side.types[i]=sb.as; moved=` ${inn.n} spiller nå som ${SLOT_NAME[sb.as].toLowerCase()}.`; }
      if(!ordersFor(side.types[i]).includes(side.o[i])) side.o[i]='normal'; else side.o[i]='normal';
      if(side.capId===sb.out) { /* kapteinsbind overtas av beste på banen via capInfo */ }
      const why=c==='trail'?' Treneren satser offensivt.':c==='lead'?' Treneren sikrer ledelsen.':'';
      push(x,{k:'sub', s:sideCode, p:inn.n, i:inn.id, tx:`Bytte for ${side.team.name}: ${inn.n} kommer inn for ${outP?outP.n:'en spiller'}.${moved}${why}`});

  }

  for(let wi=0; wi<wins.length; wi++){

    const rat=[sideRat(sides[0],Math.max(0,-diff[0])), sideRat(sides[1],Math.max(0,-diff[1]))];
    if(!firstRat) firstRat=rat.map(a=>a.slice());
    rs.push([Math.round(toReal(x0)*10)/10, rat[0].map(v=>Math.round(v*10)/10), rat[1].map(v=>Math.round(v*10)/10)]);
    trackPlayers(sides[0],w); trackPlayers(sides[1],w);
    const C=[mkCtx(sides[0],rat[0]), mkCtx(sides[1],rat[1])];
    // kapteinen samler laget
    for(let k=0;k<2;k++){ const s=sides[k]; if(diff[k]<0 && !s.capTalk){ const ci=capInfo(s); if(ci.p && ci.q>=0.4){ s.capTalk=true; push(x0+0.05,{k:'c', s:SK_[k], p:ci.p.n, tx:`${ci.p.n} samler laget og roper at nå må ${s.team.name} sette fart! Kapteinen drar laget fremover.`}); } } }
    const mh=rat[0][3], ma=rat[1][3];
    let shareH = Math.pow(mh,1.6)/(Math.pow(mh,1.6)+Math.pow(ma,1.6)); shareH = 0.5+(shareH-0.5)*0.9; shareSum+=shareH*w;
    const nH=sr(41*shareH*(1+0.03*C[0].quick)*frac), nA=sr(41*(1-shareH)*(1+0.03*C[1].quick)*frac);
    for(let k=0;k<nH;k++) attackOnce(C[0],C[1],'h',x0);

    // hjørnespark og frispark fra spill
    for(let k=0;k<2;k++){ const n=sr(1.7*frac); for(let j=0;j<n;j++){ const free=r()<.3; setPiece(C[k],C[1-k],SK_[k],x0,free); } }
    // frispark og kort
    for(let k=0;k<2;k++){
      const n=sr(3.6*frac);
      for(let j=0;j<n;j++){ const res=foul(C[k],C[1-k],SK_[k],x0,sides[k],sides[1-k]); if(res==='fk') setPiece(C[1-k],C[k],SK_[1-k],x0+0.1,true); else if(res==='pen') penalty(C[1-k],C[k],SK_[1-k],x0+0.5+r()*0.3); }
    }

    const nf=sr(8*frac); for(let j=0;j<nf;j++){ const h=r()<.5; const X=h?C[0]:C[1], Y=h?C[1]:C[0]; if(X.xi.length>2&&Y.xi.length>2) push(x0+r()*w,{k:'f', s:h?'h':'a', tx:fillerText(r,X,Y)}); }
  }
  const total=L1+15+L2;
  const st=(t,tx)=>ev.push({k:'st', s:'', t, tx});
  st(0,`Dommeren blåser i gang kampen mellom ${Ht.name} og ${At.name}!`);
  st(44.5,`Dommeren varsler ${L1-45} ${L1-45===1?'minutt':'minutter'} tilleggstid.`);
  st(L1,'Pause!');
  st(L1+15,'Andre omgang er i gang.');
  st(L1+15+44.5,`Dommeren varsler ${L2-45} minutter tilleggstid.`);
  st(total,'Dommeren blåser av kampen!');
  ev.sort((a,b)=>a.t-b.t);
  let hg=0, ag=0;
  ev.forEach(e=>{
    e.lab = e.k==='st' ? '' : labelOf(e.t, L1);
    if(GOAL_KINDS[e.k]){ if(e.s==='h') hg++; else ag++; e.sc=[hg,ag]; }
    if(e.k==='st' && e.tx==='Pause!') e.tx=`Pause! Stillingen er ${hg}–${ag}.`;
    if(e.k==='st' && e.tx==='Dommeren blåser av kampen!') e.tx=`Dommeren blåser av kampen! Sluttresultat ${Ht.name} ${hg}–${ag} ${At.name}.`;
  });
  const round1=a=>a.map(v=>Math.round(v*10)/10);

  return {hg, ag, hs:shots[0], as:shots[1], hp:Math.round(shareH*100), hr:round1(firstRat[0]), ar:round1(firstRat[1]), hf:sides[0].f, af:sides[1].f, L1, L2, rs, xg:[Math.round(xg[0]*100)/100,Math.round(xg[1]*100)/100], pr:Object.fromEntries(Object.entries(pacc).map(([id,a])=>[id,[Math.round(clamp(5*(a.c/Math.max(1,a.m))/(RATE_REF[a.st]||5),0,10)*10),Math.round(a.m),a.st,a.n,a.h?'h':'a']])), cd:cards, pl:{h:[...sides[0].played], a:[...sides[1].played]}, ev};
}

/* ---------- treningskamp: bruker godkjente oppstillinger, uten følger for tabell, kort og utestengelse ---------- */
function simulateFriendly(Ht, At, luH, luA, id){
  const mk=(T,lu)=>({...T, players:T.players.map(p=>({...p, sus:0})), lineup: lu?JSON.parse(JSON.stringify(lu)):JSON.parse(JSON.stringify(T.lineup||null))});
  const H=mk(Ht,luH), A=mk(At,luA);
  const res=simulateMatch(H,A,rngFrom('fr-'+id));
  return Object.assign({h:Ht.i,a:At.i},res);
}

/* ---------- terminliste ---------- */
function makeFixtures(season){
  const r=rngFrom('fx-'+season); let arr=[]; for(let i=0;i<N_TEAMS;i++) arr.push(i);
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  const first=[];
  for(let rd=0;rd<N_TEAMS-1;rd++){
    const pairs=[];
    for(let i=0;i<N_TEAMS/2;i++){ const a=arr[i], b=arr[N_TEAMS-1-i]; pairs.push(((rd+i)%2===0)?[a,b]:[b,a]); }
    first.push(pairs);
    arr=[arr[0], arr[N_TEAMS-1], ...arr.slice(1,N_TEAMS-1)];
  }
  const second=first.map(rd=>rd.map(p=>[p[1],p[0]]));
  return first.concat(second);
}

/* ---------- tid (Europe/Oslo) ---------- */
const TZ='Europe/Oslo';
const _fmt = new Intl.DateTimeFormat('en-GB',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
function osloParts(ms){ const o={}; _fmt.formatToParts(new Date(ms)).forEach(p=>{ if(p.type!=='literal') o[p.type]=+p.value; }); return o; }
function osloOffset(ms){ const p=osloParts(ms); return Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)-Math.floor(ms/1000)*1000; }
function osloToUtc(y,m,d,h,mi){ const guess=Date.UTC(y,m-1,d,h,mi); let ts=guess-osloOffset(guess); ts=guess-osloOffset(ts); return ts; }
function mondayOf(ms){ const p=osloParts(ms); const dt=new Date(Date.UTC(p.year,p.month-1,p.day)); const dow=(dt.getUTCDay()+6)%7; dt.setUTCDate(dt.getUTCDate()-dow); return {y:dt.getUTCFullYear(), m:dt.getUTCMonth()+1, d:dt.getUTCDate()}; }
const KICKOFF_H=18;
function slotTime(anchor, g){
  const wk=Math.floor(g/3), day=MATCH_DAYS[g%3];
  const dt=new Date(Date.UTC(anchor.y,anchor.m-1,anchor.d+7*wk+day));
  return osloToUtc(dt.getUTCFullYear(), dt.getUTCMonth()+1, dt.getUTCDate(), KICKOFF_H, 0);
}
function firstSlotAfter(anchor, ms){ let g=0; while(slotTime(anchor,g)<=ms) g++; return g; }

/* ---------- liga ---------- */
function emptyTable(){ const t=[]; for(let i=0;i<N_TEAMS;i++) t.push([0,0,0,0,0,0,0]); return t; } // [spilt,v,u,t,mål for,mål mot,poeng]
function tableOrder(tb){
  return tb.map((row,i)=>({t:i,p:row[0],w:row[1],d:row[2],l:row[3],gf:row[4],ga:row[5],pts:row[6],gd:row[4]-row[5]}))
    .sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf||a.t-b.t);
}
function createLeague(now){
  setClock(0);
  const r=rngFrom('liga-'+now); const names=new Set();
  const teams=[]; for(let i=0;i<N_TEAMS;i++){ const T=clamp(8.6+normal(r)*0.7,7.0,10.2); teams.push(newTeam(i,r,names,T)); }

/* ---------- marked ---------- */
function newMarketDoc(){ return {w:0, items:[], log:[]}; }
function addLog(market, text, w){ market.log.unshift({w, t:text}); market.log=market.log.slice(0,30); }
function fmtKr(n){ const s=Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' '); return s+' kr'; }
function refreshMarket(market, teams, r, week, names){
  market.w=week;
  // AI kjøper spillere som mennesker har lagt ut
  const keep=[];
  for(const it of market.items){
    if(it.from>=0){
      const seller=teams[it.from]; const p=seller && seller.players.find(x=>x.id===it.id);
      if(!p){ continue; }
      const v=value(p); const prob = it.price<=v*1.12 ? 0.6 : it.price<=v*1.4 ? 0.15 : 0.03;
      if(r()<prob){
        const buyers=teams.filter(t=>!t.owner && t.i!==it.from && t.money>=it.price && t.players.length<SQUAD_MAX);
        if(buyers.length){
          const b=pick(r,buyers);
          seller.players=seller.players.filter(x=>x.id!==p.id); seller.money+=it.price;
          delete p.lst; b.players.push(p); b.money-=it.price;
          addLog(market, `${b.name} kjøpte ${p.n} (${p.a} år) fra ${seller.name} for ${fmtKr(it.price)}`, week);
          continue;
        }
      }
      if(it.exp<=week){ delete p.lst; continue; }
      keep.push(it);
    } else {
      if(it.exp>week) keep.push(it);
    }
  }
  market.items=keep;
  const n=ri(r,18,22);
  for(let k=0;k<n;k++){
    const p=genMarketPlayer(r,names);
    const price=Math.round(value(p)*(1.05+r()*0.25)/1000)*1000;
    market.items.push({id:p.id, price, from:-1, exp:week+2, pl:p});

}

/* ---------- sesongskifte ---------- */
function seasonRollover(league, teams, r, names){
  const order=tableOrder(league.tb);
  const champ=order[0];

  league.hist=league.hist.slice(-20);
  order.slice(0,3).forEach((row,i)=>{ teams[row.t].money+=PRIZES[i]; });
  const notes=[];
  for(const t of teams){
    const retired=[];
    t.players.forEach(p=>{ p.gl=0; });
    t.players=t.players.filter(p=>{
      if(p.a>=38 || (p.a>=35 && r()<(p.a-34)*0.15)){ retired.push(p); return false; }
      return true;
    });
    t.players.push(genYouth(r,names));
    while(t.players.length<SQUAD_MIN+1) t.players.push(genYouth(r,names));

    ensureLineup(t);
    if(t.owner && retired.length) notes.push({t:t.i, text:`${retired.map(p=>p.n).join(', ')} la opp etter sesongen.`});
    t.st={};
  }
  league.s++; league.r=0; league.fx=makeFixtures(league.s); league.tb=emptyTable();
  return notes;
}

/* ---------- en kampdag i to faser: avspark og slutt ---------- */
function simulateRound(league, teams, market, names){
  const g=league.g;
  const rn0=rnOf(league); setClock(rn0);
  const r0=rngFrom('slot-'+g+'-'+league.s);
  const week=Math.floor(g/3);
  const out={doc:null, changed:new Set(), marketChanged:false};
  ensureAges(teams, rn0).forEach(i=>out.changed.add(i));
  if(g%3===0){
    for(const t of teams){

      trainTeam(t,r0,week); agingDecline(t,r0,week); formDrift(t,r0); weeklyFinance(t);
      out.changed.add(t.i);
    }

    out.marketChanged=true;
  }
  const rd=league.r; const kick=slotTime(league.anchor,g);
  const doc={s:league.s, r:rd, g, t:kick, live:true, m:[]};
  for(const [h,a] of league.fx[rd]){
    const Ht=teams[h], At=teams[a];
    if(!Ht.owner && (!Ht.lineup || g%3===0)) Ht.lineup=autoLineup(Ht);
    if(!At.owner && (!At.lineup || g%3===0)) At.lineup=autoLineup(At);
    const res=simulateMatch(Ht,At,rngFrom(`m-${league.s}-${rd}-${h}-${a}`));
    doc.m.push(Object.assign({h,a},res));
    out.changed.add(h); out.changed.add(a);
  }
  doc.end = kick + Math.max(...doc.m.map(m=>m.L1+15+m.L2))*60000;
  league.ph=1;
  out.doc=doc;
  return out;
}
function finishRound(league, teams, doc, names){
  const r0=rngFrom('fin-'+doc.g+'-'+league.s);
  const out={changed:new Set(), notes:[], rolled:false};
  for(const res of doc.m){
    const Ht=teams[res.h], At=teams[res.a];
    const th=league.tb[res.h], ta=league.tb[res.a];
    th[0]++; ta[0]++; th[4]+=res.hg; th[5]+=res.ag; ta[4]+=res.ag; ta[5]+=res.hg;
    if(res.hg>res.ag){ th[1]++; ta[3]++; th[6]+=3; Ht.money+=WIN_BONUS; }
    else if(res.hg<res.ag){ ta[1]++; th[3]++; ta[6]+=3; At.money+=WIN_BONUS; }
    else { th[2]++; ta[2]++; th[6]++; ta[6]++; }
    Ht.money+=GATE_HOME;
    for(const [T,code] of [[Ht,'h'],[At,'a']]){
      T.players.forEach(p=>{ if((p.sus||0)>0) p.sus--; });
      for(const id of ((res.pl&&res.pl[code])||[])){ const p=T.players.find(x=>x.id===id); if(p) p.xp=(p.xp||0)+1; }
      for(const c of (res.cd||[])){ if(c.s!==code) continue; const p=T.players.find(x=>x.id===c.i); if(!p) continue;
        if(c.k==='r') p.sus=1; else { p.yc=(p.yc||0)+1; if(p.yc>=3){ p.sus=1; p.yc=0; } } }
    }
    for(const e of res.ev){ if(!GOAL_KINDS[e.k]) continue; const T=(e.s==='h')?Ht:At; const pl=T.players.find(p=>p.id===e.i); if(pl) pl.gl=(pl.gl||0)+1; }
    out.changed.add(res.h); out.changed.add(res.a);
  }
  doc.live=false;
  league.g++; league.r++; league.ph=0;
  setClock(rnOf(league)); ensureAges(teams, rnOf(league)).forEach(i=>out.changed.add(i));
  if(league.r>=ROUNDS){
    out.notes=seasonRollover(league,teams,r0,names);
    teams.forEach(t=>out.changed.add(t.i));
    out.rolled=true;
  }
  return out;
}

}

      const p=t.players.find(x=>x.id===pid); if(!p) fail('Spilleren finnes ikke.');
      if(t.players.length<=E.SQUAD_MIN) fail('Du må beholde minst '+E.SQUAD_MIN+' spillere.');
      const price=Math.round(E.value(p)*0.45/1000)*1000;
      t.players=t.players.filter(x=>x.id!==pid); t.money+=price;
      m.items=m.items.filter(it=>it.id!==pid);
      E.addLog(m, `${t.name} solgte ${p.n} (${p.a} år) til klubbens speidere for ${E.fmtKr(price)}`, m.w);
      await retry(()=>teamRef(ti).update({players:t.players, money:t.money}));
      await retry(()=>refs.market.set(m));
      return price;
    });
  }
  async function buy(itemId, ti){
    return withLease("market", 3000, async ()=>{
      const m=await readMarket(); const it=m.items.find(x=>x.id===itemId);
      if(!it) fail('Spilleren er ikke lenger til salgs.');
      if(it.from===ti) fail('Du kan ikke kjøpe din egen spiller.');
      const b=(await teamRef(ti).get()).data();
      if(b.owner!==uid) fail('Du styrer ikke dette laget.');
      if(b.money<it.price) fail('Du har ikke råd. Du mangler '+E.fmtKr(it.price-b.money)+'.');
      if(b.players.length>=E.SQUAD_MAX) fail('Troppen er full (maks '+E.SQUAD_MAX+' spillere).');
      let p, seller=null;
      if(it.from>=0){
        seller=(await teamRef(it.from).get()).data();
        p=seller.players.find(x=>x.id===itemId);
        if(!p){ m.items=m.items.filter(x=>x.id!==itemId); await refs.market.set(m); fail('Spilleren er ikke lenger på laget.'); }
        seller.players=seller.players.filter(x=>x.id!==itemId); seller.money+=it.price;
      } else p=clone(it.pl);
      delete p.lst; delete p.no; p.gl=0;
      b.players.push(p); b.money-=it.price;
      m.items=m.items.filter(x=>x.id!==itemId);
      E.addLog(m, `${b.name} kjøpte ${p.n} (${p.a} år) for ${E.fmtKr(it.price)}${seller?` fra ${seller.name}`:''}`, m.w);
      await retry(()=>teamRef(ti).update({players:b.players, money:b.money}));
      if(seller) await retry(()=>teamRef(it.from).update({players:seller.players, money:seller.money}));
      await retry(()=>refs.market.set(m));
      return p;
    });
  }

  return { ensureInit, tick, tickFriendlies, challenge, approveFriendly, cancelFriendly, lineupLocked, claimTeam, releaseTeam, saveLineup, saveTraining, setNumbers, renameTeam, listPlayer, unlistPlayer, quickSell, buy, hid };
}

<script>
/* ===== Supabase-adapter: gir samme db-grensesnitt som spillet bruker (doc/collection/get/set/update/delete/acquire/onSnapshot) ===== */
function makeDb(sb){
  const clone = o => o===undefined?undefined:JSON.parse(JSON.stringify(o));
  const fail = (error) => { const e=new Error(error.message||'Databasefeil'); e.code = (/finnes ikke|not exist/i.test(error.message||''))?'invalid_argument':(error.code||'unavailable'); throw e; };
  const snapOf = (path, row) => ({ id:path.split('/').pop(), exists:!!row, data:()=>row?clone(row.data):undefined, metadata:{fromCache:false,hasPendingWrites:false} });
  const collOf = p => p.split('/')[0];
  let chan=0;
  function docRef(path){
    return {
      id:path.split('/').pop(), path,
      async get(){ const {data,error}=await sb.from('docs').select('path,data').eq('path',path).maybeSingle(); if(error) fail(error); return snapOf(path,data); },
      async set(v){ const {error}=await sb.from('docs').upsert({path,data:clone(v)}); if(error) fail(error); },
      async update(v){ const {error}=await sb.rpc('merge_doc',{p_path:path,p_data:clone(v)}); if(error) fail(error); },
      async delete(){ const {error}=await sb.from('docs').delete().eq('path',path); if(error) fail(error); },
      async acquire({holder,ttlMs}){ const {data,error}=await sb.rpc('acquire_lease',{p_name:path,p_holder:holder,p_ttl_ms:ttlMs||30000}); if(error) fail(error); return {acquired:data===true}; },
      onSnapshot(next,err){
        let alive=true, cur=undefined;
        const emit=row=>{ if(alive) next(snapOf(path,row)); };
        const load=async()=>{ try{ const {data,error}=await sb.from('docs').select('path,data').eq('path',path).maybeSingle(); if(error) throw error; cur=data; emit(data); }catch(e){ if(err&&alive) err(e); } };
        load();
        const ch=sb.channel('d'+(++chan)+'-'+path).on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'path=eq.'+path},p=>{
          if(p.eventType==='DELETE'){ emit(null); } else if(p.new&&p.new.data!==undefined){ emit({path,data:p.new.data}); } else load();
        }).subscribe(st=>{ if(st==='SUBSCRIBED') load(); });
        const poll=setInterval(load,30000);
        return ()=>{ alive=false; clearInterval(poll); sb.removeChannel(ch); };
      }
    };
  }
  function collRef(path, filters=[]){
    const c=collOf(path);
    const matches=row=>filters.every(([f,op,val])=>op==='=='?String(row.data[f])===String(val):true);
    const query=()=>{ let q=sb.from('docs').select('path,data').eq('coll',c); filters.forEach(([f,op,v])=>{ if(op==='==') q=q.eq('data->>'+f,String(v)); }); return q; };
    return {
      path, doc:id=>docRef(path+'/'+(id||Math.random().toString(36).slice(2))),
      where(f,op,v){ return collRef(path,filters.concat([[f,op,v]])); },
      async get(){ const {data,error}=await query(); if(error) fail(error); const docs=(data||[]).map(r=>snapOf(r.path,r)); return {docs,size:docs.length,empty:!docs.length}; },
      onSnapshot(next,err){
        let alive=true; const rows=new Map();
        const emit=()=>{ if(alive) next({docs:[...rows.values()].map(r=>snapOf(r.path,r)),metadata:{fromCache:false},docChanges:()=>[]}); };
        const load=async()=>{ try{ const {data,error}=await query(); if(error) throw error; rows.clear(); (data||[]).forEach(r=>rows.set(r.path,r)); emit(); }catch(e){ if(err&&alive) err(e); } };
        load();
        const ch=sb.channel('c'+(++chan)+'-'+path).on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'coll=eq.'+c},p=>{
          if(p.eventType==='DELETE'){ const old=p.old&&p.old.path; if(old){ rows.delete(old); emit(); } return; }
          if(p.new&&p.new.data!==undefined){ const r={path:p.new.path,data:p.new.data}; if(matches(r)) rows.set(r.path,r); else rows.delete(r.path); emit(); } else load();
        }).subscribe(st=>{ if(st==='SUBSCRIBED') load(); });
        const poll=setInterval(load,30000);
        return ()=>{ alive=false; clearInterval(poll); sb.removeChannel(ch); };
      }
    };
  }
  return { doc:docRef, collection:p=>collRef(p) };
}

(function(){

        }
        start();

    };
  }
  let started=false;
  async function start(){
    const {data}=await sb.auth.getSession(); const session=data&&data.session; if(!session) return showLogin();
    if(started) return; started=true; document.body.classList.remove('loggedout');
    const uid=session.user.id; let myName=(session.user.user_metadata&&session.user.user_metadata.name)||'';
    const user={
      id:async()=>uid, can:async()=>true, isOwner:async()=>false, canEdit:async()=>true,
      me:async()=>({id:uid,name:myName}),

    };
    window.claude={use:async n=>n==='db'?db:n==='user'?user:null};
    let acct=$('#acct'); if(!acct){ acct=document.createElement('div'); acct.id='acct'; acct.className='acct'; document.body.appendChild(acct); }
    acct.innerHTML=`<span>Innlogget som ${esc(myName||session.user.email)}</span> <button class="btn sm" id="a-out">Logg ut</button>`;
    $('#a-out').onclick=async()=>{ await sb.auth.signOut(); location.reload(); };
    window.__lm.boot();
  }
  window.__lmAuth={sb,start,showLogin};
  document.addEventListener('DOMContentLoaded',start); if(document.readyState!=='loading') setTimeout(start,0);
})();

function lum(hex){ const n=parseInt(hex.slice(1),16); const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}; return .2126*f(n>>16&255)+.7152*f(n>>8&255)+.0722*f(n&255); }
const textOn=hex=>lum(hex)>.42?'#10201A':'#FFFFFF';
function crest(t,size){ size=size||30; const [c1,c2]=t.c; const tc=textOn(c1);

async function run(fn,ok){ try{ const r=await fn(); if(ok) toast(typeof ok==='function'?ok(r):ok); return r; }catch(e){ toast((e&&e.message)||'Noe gikk galt.',true); } }

  const xi=lu.sl.map(id=>by[id]).filter(Boolean).sort((a,b)=>b.s[6]-a.s[6]);
  const tool=`<div class="row"><label class="f">Formasjon<select id="formation" data-change="formation">${Object.keys(E.FORMATIONS).map(f=>`<option value="${f}"${f===lu.f?' selected':''}>${f}</option>`).join('')}</select></label>
  <label class="f">Dødballtaker<select id="taker" data-change="taker">${xi.map(p=>`<option value="${p.id}"${p.id===lu.tk?' selected':''}>${esc(p.n)} (${p.s[6]})</option>`).join('')}</select></label>
  <button class="btn" data-act="auto" style="align-self:flex-end">Sett opp automatisk</button></div>`;
  const i=S.sel, st=slots[i], cur=by[lu.sl[i]], ord=(lu.o&&lu.o[i])||'normal';
  let roleCtl='';
  if(['DL','DC','DR'].includes(st)){ const base=E.FORMATIONS[lu.f]; const di=E.defIdx(base); const al=E.defAllowed(di.indexOf(i),di.length);
    if(al.length>1){ const nm={DC:'Midtstopper',DL:'Venstre back',DR:'Høyre back'};
      roleCtl=`<div class="row" style="margin-bottom:6px"><div class="seg" role="group" aria-label="Rolle i forsvaret">${al.map(r=>{ const t2=slots.slice(); t2[i]=r; return `<button data-act="role" data-r="${r}" aria-pressed="${r===st}"${E.validTy(base,t2)?'':' disabled'}>${nm[r]}</button>`; }).join('')}</div></div><p class="tiny muted" style="margin:0 0 12px">Du kan stille med inntil tre midtstoppere og én back på hver side.</p>`; } }
  const topSk=[...new Set(E.CT[st].slice().sort((a,b)=>b[2]-a[2]).map(c=>c[1]))].slice(0,3);
  const cand=t.players.slice().sort((a,b)=>E.slotScore(b,st)-E.slotScore(a,st));
  const where=id=>{ const j=lu.sl.indexOf(id); return j<0?'<span class="muted">Benk</span>':j===i?'<b>Her</b>':SLOT_CODE[slots[j]]; };
  const editor=`<div class="card"><h3>${E.SLOT_NAME[st]} <small>${cur?esc(cur.n):'Ingen spiller'}</small></h3>

  <p class="small muted" style="margin:0 0 12px;max-width:60ch">${ordHelp(st,ord)}</p>
  <div class="tablewrap" style="max-height:340px;overflow:auto"><table><thead><tr><th>Spiller</th><th class="c">Nå</th>${topSk.map(k=>`<th class="c" title="${E.SK_NAME[k]}">${E.SK_SHORT[k]}</th>`).join('')}<th class="c">Form</th></tr></thead><tbody>
  ${cand.map(p=>`<tr class="click${p.id===lu.sl[i]?' me':''}" data-act="assign" data-id="${p.id}"><td><span class="pname">${esc(p.n)}</span>${specBadge(p)}${isSus(p)?' <span class="tag red">Utestengt</span>':''}<div class="tiny muted">${roleOf(p)}, ${ageStr(p)}</div></td><td class="c">${where(p.id)}</td>${topSk.map(k=>`<td class="c">${sk(p.s[E.SKI[k]])}</td>`).join('')}<td class="c num" title="${FORM_LABEL[p.f||5]}">${p.f||5}</td></tr>`).join('')}</tbody></table></div></div>`;
  const extra=capSubsPanel(t,lu,by,xi);

}

function capSubsPanel(t,lu,by,xi){
  const slots=E.slotsOf(lu); const subs=lu.subs||[];
  const xiAll=lu.sl.map(id=>by[id]).filter(Boolean);
  const capList=xiAll.slice().sort((a,b)=>E.capScore(b)-E.capScore(a));
  const susXI=xiAll.filter(isSus);
  const mins=[]; for(let m=10;m<=85;m+=5) mins.push(m);
  const bench=t.players.filter(p=>!lu.sl.includes(p.id)&&!isSus(p));
  const cur=by[lu.cap];
  const row=(x,n)=>{ const inList=bench.some(p=>p.id===x.inn)?bench:bench.concat(by[x.inn]?[by[x.inn]]:[]);
    return `<div class="subrow">
    <label class="f">Fra<select data-change="subf" data-n="${n}" data-f="m">${mins.map(m=>`<option value="${m}"${x.m===m?' selected':''}>${m===45?'Etter pause':m+'. min'}</option>`).join('')}</select></label>
    <label class="f">Når<select data-change="subf" data-n="${n}" data-f="c">${Object.entries(E.SUB_COND).map(([k,v])=>`<option value="${k}"${(x.c||'always')===k?' selected':''}>${v}</option>`).join('')}</select></label>
    <label class="f">Ut<select data-change="subf" data-n="${n}" data-f="out">${xiAll.map(p=>`<option value="${p.id}"${p.id===x.out?' selected':''}>${esc(surname(p))} (${SLOT_CODE[slots[lu.sl.indexOf(p.id)]]})</option>`).join('')}</select></label>
    <label class="f">Inn<select data-change="subf" data-n="${n}" data-f="inn">${inList.map(p=>`<option value="${p.id}"${p.id===x.inn?' selected':''}>${esc(surname(p))} (${roleOf(p)})</option>`).join('')}</select></label>
    <label class="f">Posisjon<select data-change="subf" data-n="${n}" data-f="as"><option value="">Samme</option>${E.SUB_SLOTS.map(k=>`<option value="${k}"${x.as===k?' selected':''}>${E.SLOT_NAME[k]}</option>`).join('')}</select></label>
    <button class="btn sm" data-act="subdel" data-n="${n}" aria-label="Fjern bytte">Fjern</button></div>`; };
  return `<div class="card"><h3>Kaptein <small>${cur?esc(cur.n):''}</small></h3>
  ${susXI.length?`<div class="note" style="margin-bottom:12px">${susXI.map(p=>esc(p.n)).join(', ')} er utestengt og blir erstattet automatisk i neste kamp.</div>`:''}
  <label class="f">Velg kaptein<select data-change="cap">${capList.map(p=>`<option value="${p.id}"${p.id===lu.cap?' selected':''}>${esc(p.n)} – ${E.capLabel(p)}</option>`).join('')}</select></label>
  <p class="small muted" style="margin:10px 0 0;max-width:60ch">God lederegenskap og erfaring gir en bedre kaptein. En god kaptein løfter hele laget litt, og mest når dere ligger under. Erfaring bygges opp ved at spillerne spiller kamper.</p></div>
  <div class="card"><h3>Planlagte bytter <small>${subs.length} av 5</small></h3>
  <p class="small muted" style="margin:0 0 12px;max-width:62ch">Byttet gjøres tidligst ved valgt minutt, og bare hvis betingelsen er oppfylt. For å sette inn en ekstra angriper når dere ligger under, velger du «Ved tap», lar en forsvarsspiller gå ut og velger «Spiss» som posisjon. Du kan bytte inntil fem ganger. Spillere som er byttet ut, kan ikke komme inn igjen.</p>
  ${subs.length?subs.map(row).join(''):'<div class="empty" style="padding:14px 0">Ingen bytter planlagt.</div>'}
  <div class="row" style="margin-top:12px"><button class="btn primary" data-act="subadd"${subs.length>=5||lineupLocked()?' disabled':''}>Legg til bytte</button></div></div>`;
}
function needTeam(){ return `<div class="card empty">${NO_TEAM_TXT}<div style="margin-top:12px"><button class="btn primary" data-act="tab" data-k="clubs">Gå til Lag</button></div></div>`; }

function sortPlayers(list){
  const k=S.sortKey; const f={pos:(a,b)=>E.ROLES.indexOf(E.bestRole(a))-E.ROLES.indexOf(E.bestRole(b))||E.ability(b)-E.ability(a), ab:(a,b)=>E.ability(b)-E.ability(a), age:(a,b)=>a.a-b.a, no:(a,b)=>(a.no==null?999:a.no)-(b.no==null?999:b.no), val:(a,b)=>E.value(b)-E.value(a), form:(a,b)=>(b.f||5)-(a.f||5)};
  if(E.SKI[k]!=null) return list.slice().sort((a,b)=>b.s[E.SKI[k]]-a.s[E.SKI[k]]);
  return list.slice().sort(f[k]||f.pos);
}
function skHead(){ return E.SK.map(k=>`<th class="c" title="${E.SK_NAME[k]}">${E.SK_SHORT[k]}</th>`).join(''); }
function viewSquad(){
  const t=myTeam(); if(!t) return needTeam();

  const sorts=[['pos','Posisjon'],['no','Draktnummer'],['ab','Evne'],['age','Alder'],['val','Verdi'],['form','Form'],...E.SK.map(k=>[k,E.SK_NAME[k]])];
  const wages=t.players.reduce((s,p)=>s+E.wage(p),0);

  <div class="row" style="margin-bottom:12px"><label class="f">Sorter etter<select id="sortkey" data-change="sort">${sorts.map(([k,n])=>`<option value="${k}"${S.sortKey===k?' selected':''}>${n}</option>`).join('')}</select></label><button class="btn sm" data-act="autonum" title="Gir keeper nr 1, deretter forsvar, midtbane og angrep">Nummerer automatisk</button><button class="btn sm" data-act="clearnum">Fjern alle numre</button></div>

}

function viewTrain(){
  const t=myTeam(); if(!t) return needTeam();
  const tr=t.training||{a:null,b:null}; const {ks,share}=E.trainShare(t); const lu=t.lineup||E.autoLineup(clone(t));
  const roles=E.lineupRoles({players:t.players,lineup:lu,training:tr});
  const opt=(sel,none)=>(none?`<option value=""${!sel?' selected':''}>Ingen</option>`:'')+E.SK.map(k=>`<option value="${k}"${sel===k?' selected':''}>${E.SK_NAME[k]}</option>`).join('');
  const rel=ks.length?`<div class="card"><h3>Hvem får mest ut av treningen</h3><div class="grid" style="gap:14px">${ks.map(k=>`<div><div class="caps" style="margin-bottom:6px">${E.SK_NAME[k]}</div>${Object.keys(E.ROLE_NAME).map(role=>`<div class="rrow" style="grid-template-columns:90px 1fr 48px"><span class="lab">${E.ROLE_NAME[role]}</span><div class="bar acc"><i style="width:${E.REL[k][role]*100}%"></i></div><span class="val num">${Math.round(E.REL[k][role]*100)}%</span></div>`).join('')}</div>`).join('')}</div></div>`:'';
  const rows=sortPlayers(t.players).map(p=>{
    const inLine=!!roles[p.id]; const role=roles[p.id]||E.bestRole(p);
    const cells=ks.map(k=>{ const i=E.SKI[k]; const lv=p.s[i]; if(lv>=20) return `<td>${sk(lv)} <span class="muted small">Maks</span></td>`;
      const need=E.cost(lv); const have=p.pr[i]||0; const rate=E.trainingRate(p,k,role,inLine,share); const wk=rate>0.02?Math.max(1,Math.ceil((need-have)/rate)):null;
      return `<td><div class="row" style="gap:8px;flex-wrap:nowrap">${sk(lv)}<div class="bar" style="width:70px"><i style="width:${Math.min(100,have/need*100)}%"></i></div><span class="small muted num">${wk?'ca. '+wk+' u':'—'}</span></div></td>`; }).join('');
    return `<tr><td><span class="pname">${esc(p.n)}</span><div class="tiny muted">${E.ROLE_NAME[role]}${inLine?'':' (benk, halv effekt)'} · ${ageStr(p)}</div></td>${cells}</tr>`; }).join('');
  const log=(t.tl||[]).slice(0,12);
  return `<div class="sectionhead"><h2>Trening</h2><span class="muted small">Treningen regnes hver tirsdag før kampen</span></div>
  <div class="card" style="margin-bottom:16px"><div class="row"><label class="f">Hovedtrening<select id="trainA" data-change="trainA">${opt(tr.a,false)}</select></label><label class="f">Ekstra trening<select id="trainB" data-change="trainB">${opt(tr.b,true)}</select></label></div>
  <p class="small muted" style="margin:12px 0 0;max-width:70ch">${ks.length===2?'Med to treningstyper får hver av dem 60 % effekt. Du trener mer totalt, men hver egenskap utvikler seg saktere.':'Med én treningstype får egenskapen full effekt. Lave nivåer går raskt, høye nivåer tar mange uker. Unge spillere lærer mye fortere enn eldre. En 17-åring trener mer enn dobbelt så fort som en på 25.'}</p></div>
  <div class="grid g2" style="align-items:start"><div class="tablewrap" style="grid-column:1/-1"><table><thead><tr><th>Spiller</th>${ks.map(k=>`<th>${E.SK_NAME[k]}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>${rel}
  <div class="card"><h3>Siste endringer</h3>${log.length?`<ul class="timeline" style="grid-template-columns:1fr">${log.map(x=>`<li style="grid-template-columns:1fr"><span class="small"><b>${esc(x.p)}</b> <span class="${x.d>0?'up':'down'}">${x.d>0?'+1':'−1'}</span> ${E.SK_NAME[x.k]} (nivå ${x.l})</span></li>`).join('')}</ul>`:`<div class="empty">Ingen endringer ennå.</div>`}</div></div>`;
}

function marketRows(items){
  return items.map(it=>{ const p=it.p; const afford=myTeam().money>=it.price; const own=it.from===S.me;
    return `<tr><td><span class="pname">${esc(p.n)}</span>${specBadge(p)}<div class="tiny muted">${it.from>=0?esc(S.teams[it.from].name):'Fri spiller'} · ${roleOf(p)}</div></td><td class="c num" style="white-space:nowrap">${ageStr(p)}</td>${E.SK.map(k=>`<td class="c">${sk(p.s[E.SKI[k]])}</td>`).join('')}<td class="r num">${kr(it.price)}</td><td class="r">${own?`<button class="btn sm" data-act="unlist" data-id="${p.id}">Trekk tilbake</button>`:`<button class="btn sm primary" data-act="buy" data-id="${p.id}"${afford?'':' disabled'}>Kjøp</button>`}</td></tr>`; }).join('');
}
function viewMarket(){
  const t=myTeam(); if(!t) return needTeam();
  const m=S.market; if(!m) return `<div class="empty">Laster markedet…</div>`;
  const all=m.items.map(it=>({...it,p:it.from>=0?(S.teams[it.from]&&S.teams[it.from].players.find(x=>x.id===it.id)):it.pl})).filter(it=>it.p);
  const f=S.mf; let items=all.filter(it=>it.from!==S.me);
  if(f.pos) items=items.filter(it=>E.bestRole(it.p)===f.pos);
  items=items.filter(it=>it.p.a<=f.maxAge);
  const sorters={price:(a,b)=>a.price-b.price, ab:(a,b)=>E.ability(b.p)-E.ability(a.p), age:(a,b)=>a.p.a-b.p.a};
  items.sort(sorters[f.sort]||sorters.price);
  const mine=all.filter(it=>it.from===S.me);
  const filt=`<div class="row" style="margin-bottom:12px"><label class="f">Posisjon<select id="mfpos" data-change="mfpos"><option value="">Alle</option>${E.ROLES.map(r=>`<option value="${r}"${f.pos===r?' selected':''}>${E.ROLE_NAME[r]}</option>`).join('')}</select></label>
  <label class="f">Maks alder<select id="mfage" data-change="mfage">${[40,34,30,26,23,20].map(a=>`<option value="${a}"${f.maxAge===a?' selected':''}>${a===40?'Alle':a+' år'}</option>`).join('')}</select></label>
  <label class="f">Sorter<select id="mfsort" data-change="mfsort"><option value="price"${f.sort==='price'?' selected':''}>Pris</option><option value="ab"${f.sort==='ab'?' selected':''}>Evne</option><option value="age"${f.sort==='age'?' selected':''}>Alder</option></select></label></div>`;
  const head=`<thead><tr><th>Spiller</th><th class="c">Alder</th>${skHead()}<th class="r">Pris</th><th></th></tr></thead>`;
  return `<div class="sectionhead"><h2>Marked</h2><span class="muted small">Kasse ${kr(t.money)} · Nye spillere hver tirsdag, annonser varer i to uker</span></div>${filt}

/* ---------- ratinger som søyler, spillerrating, flaks ---------- */
function ratAt(m,el){
  if(!m.rs||!m.rs.length) return {h:m.hr,a:m.ar,t:null};
  let cur=m.rs[0]; for(const x of m.rs){ if(x[0]<=el+0.01) cur=x; else break; }
  return {h:cur[1],a:cur[2],t:cur[0]};
}
function duelRow(l,r,hv,av){
  const sc=v=>Math.min(100,v/14*100);
  return `<div class="drow"><div class="cap"><span>${l}</span><span>${r}</span></div><div class="bars"><span class="dv h">${hv.toFixed(1)}</span><div class="dbar h${hv>=av?' win':''}"><i style="width:${sc(hv)}%"></i></div><div class="dbar a${av>hv?' win':''}"><i style="width:${sc(av)}%"></i></div><span class="dv a">${av.toFixed(1)}</span></div></div>`;
}
function duelsInner(m,H,A,el){
  const q=ratAt(m,el), h=q.h, a=q.a;
  return `<div class="dlegend"><span class="h">${esc(H.name)}</span><span class="a">${esc(A.name)}</span></div>
  <div class="dgrp">${esc(H.short)} angriper</div>
  ${duelRow('Midtangrep','Midtforsvar',h[5],a[1])}${duelRow('Venstre angrep','Høyre forsvar',h[4],a[2])}${duelRow('Høyre angrep','Venstre forsvar',h[6],a[0])}
  <div class="dgrp">Midtbanen</div>
  ${duelRow('Midtbane','Midtbane',h[3],a[3])}
  <div class="dgrp">${esc(A.short)} angriper</div>
  ${duelRow('Midtforsvar','Midtangrep',h[1],a[5])}${duelRow('Høyre forsvar','Venstre angrep',h[2],a[4])}${duelRow('Venstre forsvar','Høyre angrep',h[0],a[6])}`;
}
function minLabel(m,el){ return el>=m.L1+15 ? E.labelOf(Math.max(m.L1+15.5,el),m.L1) : el>=m.L1 ? 'Pause' : E.labelOf(Math.max(0.3,el),m.L1); }
function duelsCard(m,H,A,lv,key){
  const dur=m.L1+15+m.L2; const hasRs=!!(m.rs&&m.rs.length);
  let el=lv.el, ctl='';
  if(lv.st==='done'){
    el=(S.scrub&&S.scrub.key===key)?S.scrub.el:dur;
    if(hasRs) ctl=`<div class="scrub"><label for="scrub">Se ratingene i minutt</label><input type="range" id="scrub" min="0" max="${Math.round(dur)}" step="1" value="${Math.round(el)}" data-input="scrub"><b class="num" id="scrublab">${esc(minLabel(m,el))}</b></div>`;
  }
  return `<div class="caps" style="margin:18px 0 8px">Ratinger${hasRs?' mot hverandre':''} <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">${lv.st==='done'?'':'· oppdateres underveis, bytter og kort endrer dem'}</span></div>${ctl}<div class="duels" id="duels">${duelsInner(m,H,A,el)}</div>${hasRs?'':'<p class="tiny muted">Denne kampen ble spilt før ratinger underveis ble innført. Viser ratingene fra avspark.</p>'}`;
}
function luckHtml(m,H,A){
  if(!m.xg) return '';
  const d=(m.hg-m.xg[0])-(m.ag-m.xg[1]);
  const pos=Math.max(4,Math.min(96,50-d/3*50));
  const ad=Math.abs(d); const who=d>0?H.name:A.name; const dir=d>0.25?'h':d<-0.25?'a':'';
  const verdict=ad<0.4?'Resultatet var rettferdig. Ingen av lagene var spesielt heldige.':`${esc(who)} var ${ad<1?'litt':ad<1.8?'ganske':'veldig'} heldig. ${esc(d>0?A.name:H.name)} fortjente mer, ut fra sjansene.`;
  const left=Math.min(50,pos), w=Math.abs(pos-50);
  return `<div class="caps" style="margin:18px 0 8px">Flaks og uflaks</div>
  <div class="luck"><div class="ltrack"><i class="lc"></i>${dir?`<i class="lfill ${dir}" style="left:${left}%;width:${w}%"></i>`:''}<span class="lmark ${dir||'n'}" style="left:${pos}%">${dir==='h'?'◀':dir==='a'?'▶':'●'}</span></div>
  <div class="llab"><span>Flaks for ${esc(H.short)}</span><span>Flaks for ${esc(A.short)}</span></div></div>
  <p class="small" style="margin:10px 0 0">${verdict}</p>
  <p class="tiny muted" style="margin:4px 0 0">Forventede mål ut fra sjansenes kvalitet: ${esc(H.short)} ${m.xg[0].toFixed(1)}, ${esc(A.short)} ${m.xg[1].toFixed(1)}. Faktisk resultat ${m.hg}–${m.ag}.</p>`;
}
function playerRatingsHtml(m,H,A){
  if(!m.pr) return '';
  const ent=Object.entries(m.pr); if(!ent.length) return '';
  let best=null; ent.forEach(([id,v])=>{ if(!best||v[0]>best[1][0]) best=[id,v]; });
  const tbl=(code,T)=>{
    const by={}; T.players.forEach(p=>by[p.id]=p);
    const rows=ent.filter(([id,v])=>v[4]===code).map(([id,v])=>{ const r=v[0]/10; const p=by[id]; const cls=r>=7?'hi':r<4?'lo':'';
      return `<tr><td class="num c">${p&&p.no!=null?p.no:''}</td><td>${esc(v[3])}${best&&best[0]===id?' <span class="tag cap" title="Banens beste">Banens beste</span>':''}</td><td class="c">${SLOT_CODE[v[2]]||''}</td><td class="r num">${v[1]}'</td><td class="r num prate ${cls}">${r.toFixed(1)}</td></tr>`; }).join('');
    return `<div><div class="caps" style="margin-bottom:6px">${esc(T.name)}</div><div class="tablewrap"><table><thead><tr><th class="c">Nr</th><th>Spiller</th><th class="c">Pos</th><th class="r">Min</th><th class="r">Rating</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  };
  return `<div class="caps" style="margin:18px 0 8px">Spillerratinger</div><div class="grid g2" style="gap:16px">${tbl('h',H)}${tbl('a',A)}</div>
  <p class="tiny muted" style="margin-top:8px">Ratingen viser hvor mye spilleren bidro til lagets ratinger, ut fra egenskaper, form, rolle og ordre, som snitt over minuttene han var på banen. Bytter påvirker ikke ratingen. 5 er typisk for rollen, 7 og over er en god kamp.</p>`;
}
function replayCtl(doc,m,lv,key){

}

function viewHelp(){
  return `<div class="sectionhead"><h2>Regler</h2></div><div class="card help">
  <h3>Liga og kamper</h3><ul><li>14 lag i én divisjon. Alle møter alle to ganger, så en sesong er 26 runder.</li><li>Alle lag spiller tre ganger i uka: tirsdag, fredag og søndag klokka 18.00 norsk tid.</li><li>Kampene spilles i sanntid: 45 minutter pluss tilleggstid, 15 minutter pause og så 45 minutter pluss tilleggstid. Er du inne på siden mens kampen pågår, får du kommentarer og beskjed om mål underveis.</li><li>Oppstillingen låses ved avspark og åpnes igjen når alle kamper er ferdige. Tabellen oppdateres først da.</li><li>Lag uten menneskelig manager styres av datamaskinen. Når du tar over et lag, erstatter du datamaskinen og beholder spillerne.</li><li>Spillet kjører ikke på noen server. Første som åpner siden etter avspark setter kampene i gang, og alle ser det samme med riktig klokkeslett. Kommer du inn midt i kampen, ser du først det som har skjedd så langt.</li></ul>
  <h3>Spillere og egenskaper</h3><ul><li>Alle spillere er fantasispillere. På A-laget kan spillere være 17 år og eldre.</li><li>Sju egenskaper fra 0 til 20: Keeper, Forsvar, Midtbane, Pasning, Ving, Scoring og Dødballer.</li><li>Fra 30 år mister spillerne gradvis nivå, raskere jo eldre de blir. Ving og forsvar faller først, dødballer og keeper holder lengst.</li><li>Alder måles i år og dager. Ett aldersår tilsvarer at serien er spilt to ganger (52 runder, omtrent 17 uker), og hver spiller har sin egen bursdag. Etter hver sesong legger de eldste opp, og hvert lag får en ny ungdomsspiller på 17 år.</li></ul>
  <h3>Trening</h3><ul><li>Velg én eller to egenskaper. Med to får hver av dem 60 % effekt.</li><li>Trening av forsvar gir mye til forsvarere og backer, litt til midtbane og lite til spisser. Det samme prinsippet gjelder for de andre egenskapene.</li><li>Lave nivåer går fort. Hvert nivå krever omtrent 16 % mer trening enn det forrige. Spillere fra 17 til 22 år trener opptil 2,2 ganger så fort som voksne. Treningen går sakte: en 17-åring med nivå 7 i tre egenskaper kan med ideell trening nå nivå 15 i alle tre først rundt 30-årsalderen. Spillere som ikke er med i startellveren trener med halv effekt.</li></ul>
  <h3>Ratinger og oppstilling</h3><ul><li>Spillernes egenskaper gir sju ratinger: forsvar venstre, midten og høyre, midtbane, og angrep venstre, midten og høyre.</li><li>Backer og ving bidrar mest på sin egen side. Midtbane styrer midtbanen og hjelper midtforsvaret og midtangrepet. Pasning bidrar til angrep, men mindre enn scoring for spisser og ving for vinger.</li><li>Du kan sende en spiller i en bestemt retning. En defensiv midtbane gir mer forsvar men mindre angrep, og «Mot venstre» flytter noe av innsatsen ut på kanten.</li><li>Formen går opp og ned fra uke til uke og påvirker alle ratingene.</li><li><b>Keeper:</b> Keeperskill teller mest for keeperen. Han bidrar sterkt til midtforsvaret og litt til sidene, og avgjør mye i hver avslutning. Forsvarsskill teller ikke for keeperen. På frispark, hjørnespark og straffer teller dødball mest for keeperen, og keeperskill teller en del.</li><li><b>Ratinger i kampen:</b> Under og etter kampen vises ratingene som søyler mot hverandre: midtangrep mot midtforsvar, venstre angrep mot motstanderens høyre forsvar, høyre angrep mot venstre forsvar, og midtbane mot midtbane. Ratingene oppdateres underveis, så du ser hva bytter og røde kort gjør. Etter kampen kan du dra i glidebryteren for å se ratingene i et bestemt minutt.</li><li><b>Spillerrating:</b> Hver spiller får et tall for kampen ut fra hvor mye han bidro til lagets ratinger (egenskaper, form, rolle og ordre) som snitt over minuttene han var på banen. En spiller som byttes ut etter en flott første omgang beholder ratingen sin. 5 er typisk for rollen, 7 og over er en god kamp.</li><li><b>Flaks og uflaks:</b> Hver sjanse har en sannsynlighet for mål. Summen er forventede mål. Pilen viser hvilket lag som fikk mer ut av sjansene enn de fortjente.</li><li><b>Reprise:</b> Når du logger inn etter at en kamp er spilt, kan du velge å se den i reprise eller få resultatet direkte. Reprise finnes også under hver ferdigspilt kamp.</li><li><b>Draktnummer:</b> Under Spillere kan du gi spillerne nummer og sortere etter dem.</li><li><b>Mål fra åpent spill:</b> Om et angrep ender i mål avgjøres av lagets rating i angrepssonen (venstre, midten eller høyre) mot motstanderens forsvarsrating i samme sone, keeper inkludert. Spilleren som avslutter er bare den som får æren. Formasjonen påvirker målantallet: offensive oppsett som 3-4-3 og 3-5-2 gir flest mål, mens 5-4-1 og 5-3-2 gir få.</li><li><b>Straffer:</b> Fouler i feltet gir straffe. Den tas av dødballtakeren, og dødball teller mest for skytteren, mens scoring teller litt. Mot keeperen avgjør dødball og keeperskill.</li><li><b>Ving:</b> Settes en ving offensivt, bidrar han mer til sideangrep og litt mindre til midtbane og forsvar. Settes han mot midten, bidrar han litt mer til midtbanen, men mindre til sideforsvar og sideangrep.</li><li><b>Spiss:</b> Spissen kan spille normalt, mot siden eller defensivt. En defensiv spiss gir mer midtbane og mindre angrep.</li><li><b>Forsvar:</b> Spiller du med tre, fire eller fem forsvarsspillere, kan du velge om de spiller som midtstoppere eller backer. Maks tre midtstoppere og én back på hver side.</li></ul>
  <h3>Personlighet, erfaring og kaptein</h3><ul><li>Spillerne har temperament, lederegenskap og noen har en spillestil: Lagspiller, Individualist, Kjemper eller Fair spiller. Du ser det på spillerkortet.</li><li>Erfaring bygges opp ved at spillerne spiller kamper. Lederegenskap og erfaring avgjør hvor godt egnet en spiller er som kaptein.</li><li>En god kaptein løfter alle ratingene litt, og mest når laget ligger under. Spilles kapteinen av banen, tar den beste på banen over med litt mindre effekt.</li></ul>
  <h3>Kort og utestengelse</h3><ul><li>Temperamentsfulle spillere forårsaker lettere frispark og får oftere gult kort.</li><li>To gule kort i samme kamp gir rødt kort. Rødt kort er sjeldent, og laget må spille resten av kampen med ti mann.</li><li>Rødt kort gir én kamps utestengelse. Det samme gjelder tre gule kort i ulike kamper.</li></ul>
  <h3>Bytter</h3><ul><li>Hvert lag kan bytte inntil fem spillere i løpet av en kamp. Du planlegger dem i Oppstilling: velg minutt, betingelse (alltid, ved tap, ved ledelse eller ved uavgjort), hvem som går ut og inn, og eventuelt ny posisjon.</li><li>Eksempel: ved tap fra 60. minutt går en midtstopper ut og en ekstra spiss kommer inn. Ved ledelse kan du gjøre det motsatte.</li></ul>
  <h3>Spesialiteter</h3><ul>${Object.keys(E.SPEC).map(k=>`<li><b>${E.SPEC[k]}:</b> ${E.SPEC_INFO[k]}</li>`).join('')}</ul>
  <h3>Treningskamper</h3><ul><li>I tillegg til serien kan du sette opp treningskamper mot andre managere og datastyrte lag. Det gjør du under Treningskamp.</li><li>Utfordrer du en annen manager, starter kampen så snart begge har godkjent oppstillingen. Utfordrer du et datastyrt lag, starter kampen 2 minutter etter at du har godkjent din.</li><li>Treningskamper påvirker ikke tabellen, pengene, kortene, utestengelsene eller erfaringen.</li></ul>
  <h3>Økonomi og marked</h3><ul><li>Hver uke får laget sponsorinntekter, og hver hjemmekamp gir billettinntekter. Lønningene trekkes hver uke.</li><li>Nye spillere dukker opp på markedet hver tirsdag. Du kan også legge ut dine egne spillere til en pris du velger, eller selge dem raskt til speiderne for 45 % av verdien.</li><li>De tre beste lagene får premiepenger når sesongen er over.</li></ul></div>`;
}

function render(){
  const act=document.activeElement;
  if(act && act.matches && act.matches('#modal input, #view input[type=text], #view input[type=number]')){ S.pendingRender=true; return; }
  S.pendingRender=false;
  $('#top').innerHTML=topbar();
  $('#tabs').innerHTML=tabsBar();
  const v=$('#view');
  if(!S.ready){ v.innerHTML=`<div class="empty">Laster ligaen…</div>`; return; }
  if(!S.league || !teamOk()){ v.innerHTML=`<div class="empty">${S.canWrite===false?'Ligaen er ikke opprettet ennå. Be eieren om å åpne siden først.':'Oppretter ligaen med 14 lag…'}</div>`; return; }
  const views={home:viewHome,lineup:viewLineup,squad:viewSquad,train:viewTrain,market:viewMarket,table:viewTable,games:viewGames,friendly:viewFriendly,clubs:viewClubs,help:viewHelp};
  const sy=window.scrollY;
  try{ v.innerHTML=views[S.tab](); }catch(e){ console.error(e); v.innerHTML=`<div class="empty">Noe gikk galt under visningen. Prøv å bytte fane.</div>`; }
  if(sy) window.scrollTo(0,sy);
}

function fixOrders(lu){ const slots=E.slotsOf(lu); lu.o=slots.map((st,i)=>{ const o=(lu.o&&lu.o[i])||'normal'; return E.ordersFor(st).includes(o)?o:'normal'; }); }
function saveLU(lu){ if(lineupLocked()){ toast('Kampene pågår. Oppstillingen er låst til alle kamper er ferdige.',true); requestRender(); return; } const t=myTeam(); fixOrders(lu); { const by=E.mapById(t.players); if(!lu.cap||!lu.sl.includes(lu.cap)) lu.cap=E.bestCaptainId(by,lu.sl); const n0=(lu.subs||[]).length; lu.subs=(lu.subs||[]).filter(x=>lu.sl.includes(x.out)&&by[x.inn]&&!lu.sl.includes(x.inn)); if(lu.subs.length<n0) toast('Noen planlagte bytter passet ikke lenger og er fjernet.'); } S.teams[S.me]={...t,lineup:lu}; requestRender(); return run(()=>S.store.saveLineup(S.me,lu)); }

  claim(el){ const t=S.teams[+el.dataset.i]; openModal(`<button class="btn sm x" data-act="closemodal">Lukk</button><h3>Ta over ${esc(t.name)}</h3><p class="muted small" style="margin:4px 0 14px">Du kan gi klubben et nytt navn nå, eller beholde det gamle. Du kan også endre det senere.</p><div class="row"><label class="f">Klubbnavn<input type="text" id="claimName" maxlength="28" value="${esc(t.name)}"></label><button class="btn primary" data-act="doclaim" data-i="${t.i}" style="align-self:flex-end">Bli manager</button></div>`); setTimeout(()=>{ const i=$('#claimName'); if(i){ i.focus(); i.select(); } },0); },

    let oi=-1,ov=1e9; lu.sl.forEach((id,i)=>{ const p=by[id]; if(!p||slots[i]==='GK'||usedOut.has(id)) return; const v=E.slotScore(p,slots[i]); if(v<ov){ov=v;oi=i;} });
