  subf(el){ const t=myTeam(); const lu=clone(t.lineup); const x=(lu.subs||[])[+el.dataset.n]; if(!x) return; const f=el.dataset.f; x[f]= f==='m'?+el.value : f==='as'?(el.value||null) : el.value; if(x.out===x.inn){ toast('Spilleren som går ut og inn må være ulike.',true); render(); return; } saveLU(lu); },
  taker(el){ const t=myTeam(); const lu=clone(t.lineup); lu.tk=el.value; saveLU(lu); },
  sort(el){ S.sortKey=el.value; render(); },
  pno(el){ const t=myTeam(); if(!t) return; const id=el.dataset.id; const raw=el.value.trim(); const v=raw===''?null:Number(raw); if(v!==null && (!Number.isInteger(v)||v<1||v>99)){ toast('Draktnummer må være et tall fra 1 til 99.',true); { const q=t.players.find(p=>p.id===id); el.value=q&&q.no!=null?q.no:''; } return; } if(v!==null && t.players.some(p=>p.id!==id&&p.no===v)){ toast('Nummer '+v+' er allerede i bruk på laget.',true); { const q=t.players.find(p=>p.id===id); el.value=q&&q.no!=null?q.no:''; } return; } applyNumbers({[id]:v}); },
  trainA(el){ const t=myTeam(); const tr={a:el.value||null,b:(t.training&&t.training.b)||null}; if(tr.b===tr.a) tr.b=null; S.teams[S.me]={...t,training:tr}; requestRender(); run(()=>S.store.saveTraining(S.me,tr),'Treningen er lagret.'); },
  trainB(el){ const t=myTeam(); const tr={a:(t.training&&t.training.a)||null,b:el.value||null}; if(tr.b&&tr.b===tr.a){ toast('Velg en annen egenskap enn hovedtreningen.',true); render(); return; } S.teams[S.me]={...t,training:tr}; requestRender(); run(()=>S.store.saveTraining(S.me,tr),'Treningen er lagret.'); },
  mfpos(el){ S.mf.pos=el.value; render(); }, mfage(el){ S.mf.maxAge=+el.value; render(); }, mfsort(el){ S.mf.sort=el.value; render(); }
};
document.addEventListener('click',ev=>{ if(ev.target.closest('input,select')) return; const el=ev.target.closest('[data-act]'); if(!el) return; const f=actions[el.dataset.act]; if(f){ ev.preventDefault(); f(el,ev); } });
document.addEventListener('input',ev=>{ const el=ev.target.closest('[data-input]'); if(!el) return; if(el.dataset.input==='scrub'){ const a=S.mpArgs; if(!a) return; const [doc,m]=a; S.scrub={key:mkey(m,doc),el:+el.value}; const d=$('#duels'); if(d) d.innerHTML=duelsInner(m,S.teams[m.h],S.teams[m.a],S.scrub.el); const lb=$('#scrublab'); if(lb) lb.textContent=minLabel(m,S.scrub.el); } });
document.addEventListener('change',ev=>{ const el=ev.target.closest('[data-change]'); if(!el) return; const f=changes[el.dataset.change]; if(f) f(el); });
document.addEventListener('focusout',()=>{ setTimeout(()=>{ if(S.pendingRender) render(); },50); });
document.addEventListener('keydown',ev=>{ if(ev.key==='Enter' && (ev.target.id==='claimName'||ev.target.id==='newName')){ const b=$('#modal .btn.primary'); if(b) b.click(); } if(ev.key==='Escape' && $('#modal').firstChild) closeModal(); });

/* ---------- oppstart ---------- */
function afterTeams(){
  const i=S.teams.findIndex(t=>t&&t.owner&&t.owner===S.uid); S.me=(S.uid&&i>=0)?i:null;
  const ids=[...new Set(S.teams.filter(t=>t&&t.owner).map(t=>t.owner))];
  if(S.user && ids.length){ S.user.profiles(ids).then(ps=>{ let ch=false; ids.forEach(id=>{ const n=(ps[id]&&ps[id].name)||''; if(n && S.names[id]!==n){ S.names[id]=n; ch=true; } if(ps[id]&&ps[id].isMe&&n) S.myName=n; }); if(ch) requestRender(); }).catch(()=>{}); }
}
let unsubRounds=null, roundsSeason=null;
function watchRounds(db){
  const s=S.league&&S.league.s; if(!s||s===roundsSeason) return; roundsSeason=s; if(unsubRounds) unsubRounds(); S.rounds={};
  unsubRounds=db.collection('rounds').where('s','==',s).onSnapshot(q=>{ const m={}; q.docs.forEach(d=>{ const v=d.data(); if(v) m[v.r]=v; }); S.rounds=m; requestRender(); },e=>console.warn(e));
}
function needTick(){
  const L=S.league; if(!L) return false; const now=Date.now();
  if(!L.ph) return now>=E.slotTime(L.anchor,L.g);
  const d=S.rounds[L.r]; return d?now>=d.end:false;
}
async function maybeTick(){
  if(S.ticking||!S.store||S.canWrite===false) return;
  const lg=S.league&&needTick(), fr=friendlyDue(); if(!lg&&!fr) return;
  S.ticking=true;
  try{ if(lg) await S.store.tick(); else await S.store.tickFriendlies(); }
  catch(e){ console.warn(e); } finally{ S.ticking=false; }
}
function liveTick(){
  if(!S.ready||!S.league) return;
  maybeTick(); checkPrompt();
  const doc=roundDoc(); const t=myTeam(); const fd=myFriendly();
  const items=[]; if(doc) doc.m.forEach(m=>items.push({key:doc.s+'-'+doc.r+'-'+m.h,m,doc}));
  if(fd&&fd.m&&fd.st==='live') items.push({key:'f'+fd.id,m:fd.m,doc:fd});
  items.forEach(({key,m,doc:d})=>{
    const lv=liveOf(m,d,true); const prev=S.seen[key];
    if(prev==null){ S.seen[key]=lv.vis.length; return; }
    if(lv.vis.length>prev){
      if(t&&(m.h===t.i||m.a===t.i)) lv.vis.slice(prev).forEach(e=>{
        if(E.GOAL_KINDS[e.k]) toast(`${e.lab} MÅL for ${S.teams[e.s==='h'?m.h:m.a].name}! ${e.p}. Stillingen er ${e.sc[0]}–${e.sc[1]}.`);
        else if(e.k==='rc') toast(e.tx);
        else if(e.k==='st' && /Pause|blåser av/.test(e.tx)) toast(e.tx);
      });
      S.seen[key]=lv.vis.length;
    }
  });
  const sig=items.map(({m,doc:d})=>{ const lv=liveOf(m,d,true); return lv.st+lv.vis.length+(S.watch&&S.watch.h===m.h?lv.label:''); }).join('|')+'|'+(fd?fd.st+fd.id:'')+(myTeam()?'':'x');
  if(sig!==S.liveSig){ S.liveSig=sig; if(['home','games','lineup','friendly'].includes(S.tab)) requestRender(); else { $('#top').innerHTML=topbar(); $('#tabs').innerHTML=tabsBar(); } }
}
function refreshPanel(){ const a=S.mpArgs; const d=$('#mp'); if(!a||!d) return; d.outerHTML=matchPanel(a[0],a[1]); }
function applyNumbers(map){
  const t=myTeam(); if(!t) return;
  S.teams[S.me]={...t,players:t.players.map(p=>{ if(!Object.prototype.hasOwnProperty.call(map,p.id)) return p; const q={...p}; if(map[p.id]==null) delete q.no; else q.no=map[p.id]; return q; })};
  requestRender(); run(()=>S.store.setNumbers(S.me,map),'Draktnumrene er lagret.');
}
/* reprise: egen klokke som går raskere enn virkeligheten */
setInterval(()=>{
  const rp=S.rp; if(!rp) return; const n=Date.now();
  if(!rp.playing||!$('#mp')){ rp.last=n; return; }
  const a=S.mpArgs; if(!a) return; const m=a[1]; const dur=m.L1+15+m.L2;
  rp.el=Math.min(dur+0.01,rp.el+(n-rp.last)/1000*rp.speed); rp.last=n;
  if(rp.el>=dur){ S.rp=null; render(); return; }
  refreshPanel();
},500);
/* valg etter innlogging: reprise eller resultat */
function seenKey(){ return 'lm-seen-'+(S.uid||''); }
function getSeen(){ try{ return JSON.parse(localStorage.getItem(seenKey())||'null'); }catch(e){ return null; } }
function markSeen(doc){ try{ const cur=getSeen(); if(!cur||cur.s<doc.s||(cur.s===doc.s&&cur.r<doc.r)) localStorage.setItem(seenKey(),JSON.stringify({s:doc.s,r:doc.r})); }catch(e){} }
function checkPrompt(){
  const t=myTeam(); if(!t||S.promptDone) return; if($('#modal').firstChild) return;
  const docs=Object.values(S.rounds).filter(d=>d&&d.m&&d.s===S.league.s).sort((a,b)=>a.r-b.r);
  if(!docs.length) return;
  let latest=null;
  for(const d of docs){ const m=d.m.find(x=>x.h===t.i||x.a===t.i); if(!m) continue; const st=liveOf(m,d,true).st; if(st==='live'||st==='break'){ markSeen(d); } else if(st==='done') latest={doc:d,m}; }
  if(!latest) return;
  const cur=getSeen(); if(cur&&(cur.s>latest.doc.s||(cur.s===latest.doc.s&&cur.r>=latest.doc.r))){ S.promptDone=true; return; }
  S.promptDone=true; S.pend=latest;
  const H=S.teams[latest.m.h], A=S.teams[latest.m.a];
  openModal(`<h3>Kampen er spilt</h3><p style="margin:4px 0 14px">${esc(H.name)} mot ${esc(A.name)} (runde ${latest.doc.r+1}) ble spilt ${fmtTime(latest.doc.t)}. Hva vil du se?</p><div class="row"><button class="btn primary" data-act="replaymodal" data-v="rp">Se reprise</button><button class="btn" data-act="replaymodal" data-v="res">Vis resultatet direkte</button><button class="btn" data-act="later">Senere</button></div>`);
}
async function boot(){
  try{ const t=localStorage.getItem('lm-tab'); if(t && TABS.some(x=>x[0]===t)) S.tab=t; }catch(e){}
  render();
  const cl=window.claude; const db=cl?await cl.use('db'):null; const user=cl?await cl.use('user'):null;
  if(!db){ $('#view').innerHTML=`<div class="empty">Spillet trenger lagring i Claude. Åpne siden i Claude for å spille.</div>`; return; }
  S.user=user; S.uid=user?await user.id():null; S.canWrite=user?await user.can('data.write'):null;
  if(user){ try{ const me=await user.me(); S.myName=me.name||''; }catch(e){} }
  S.store=makeStore({db,uid:S.uid});
  db.doc('league/main').onSnapshot(snap=>{
    S.league=snap.exists?snap.data():null; S.ready=true;
    if(!snap.exists && !snap.metadata.fromCache && S.canWrite!==false && S.uid){ S.store.ensureInit().catch(e=>toast('Kunne ikke opprette ligaen: '+e.message,true)); }
    if(S.league){ watchRounds(db); maybeTick(); }
    requestRender();
  },e=>console.warn(e));
  db.collection('teams').onSnapshot(q=>{ const arr=new Array(E.N_TEAMS).fill(null); q.docs.forEach(d=>{ const t=d.data(); if(t&&typeof t.i==='number') arr[t.i]=t; }); S.teams=arr; afterTeams(); requestRender(); },e=>console.warn(e));
  db.collection('friendlies').onSnapshot(q=>{ const m={}; q.docs.forEach(d=>{ const v=d.data(); if(v&&v.id) m[v.id]=v; });
    const prev=S.friendlies; S.friendlies=m;
    Object.values(m).forEach(f=>{ if(f.st==='open'&&S.me!=null&&f.a===S.me&&!f.ok.a&&!prev[f.id]&&S.teams[f.h]) toast(`${S.teams[f.h].name} utfordrer deg til treningskamp! Gå til Treningskamp for å svare.`); });
    S.frLoaded=true; requestRender(); },e=>console.warn(e));
  db.doc('market/current').onSnapshot(snap=>{ S.market=snap.exists?snap.data():null; requestRender(); },e=>console.warn(e));
  setInterval(liveTick,2000);
  setInterval(()=>{ if(S.ready && S.league){ $('#top').innerHTML=topbar(); } },30000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) maybeTick(); });
}
window.__lm={S,E,render,boot};
if(!window.__deferBoot) boot();
})();

</script>
